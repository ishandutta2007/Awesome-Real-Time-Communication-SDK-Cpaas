<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accent1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="accent2" x1="0%" x2="100%" y1="100%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes floatParticle{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(180deg)}}.badge-text,.subtitle,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.bg-pulse-1{animation:pulseGlow 6s ease-in-out infinite;transform-origin:1000px 80px}.bg-pulse-2{animation:pulseGlow 8s ease-in-out infinite 1s;transform-origin:150px 240px}.particle{animation:floatParticle 10s ease-in-out infinite;transform-origin:center}.connecting-line{stroke-dasharray:8 8;animation:waveDash 3s linear infinite}</style><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><g class="bg-pulse-1"><circle cx="1020" cy="70" r="160" fill="url(#accent1)" filter="url(#glow)" opacity=".25"/></g><g class="bg-pulse-2"><circle cx="120" cy="250" r="130" fill="url(#accent2)" filter="url(#glow)" opacity=".2"/></g><g opacity=".35"><line x