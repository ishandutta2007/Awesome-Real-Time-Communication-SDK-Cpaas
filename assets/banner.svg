<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient 1 -->
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Accent Gradient 2 -->
    <linearGradient id="accent2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glowing Pill Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    
    /* Subtle Dynamic Pulse Effects (Background Only) */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    @keyframes waveDash {
      to { stroke-dashoffset: -40; }
    }

    .bg-pulse-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 1000px 80px;
    }
    .bg-pulse-2 {
      animation: pulseGlow 8s ease-in-out infinite 1s;
      transform-origin: 150px 240px;
    }
    .particle {
      animation: floatParticle 10s ease-in-out infinite;
      transform-origin: center;
    }
    .connecting-line {
      stroke-dasharray: 8 8;
      animation: waveDash 3s linear infinite;
    }
  </style>

  <!-- Base Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Kept strictly behind text) -->
  <g class="bg-pulse-1">
    <circle cx="1020" cy="70" r="160" fill="url(#accent1)" opacity="0.25" filter="url(#glow)" />
  </g>
  <g class="bg-pulse-2">
    <circle cx="120" cy="250" r="130" fill="url(#accent2)" opacity="0.2" filter="url(#glow)" />
  </g>

  <!-- Network Topology Visual Pattern (Right side decorative background) -->
  <g opacity="0.35">
    <line x1="850" y1="80" x2="980" y2="150" stroke="#6366f1" stroke-width="2" class="connecting-line" />
    <line x1="980" y1="150" x2="1100" y2="90" stroke="#a855f7" stroke-width="2" class="connecting-line" />
    <line x1="980" y1="150" x2="1050" y2="240" stroke="#ec4899" stroke-width="2" class="connecting-line" />
    <line x1="850" y1="220" x2="980" y2="150" stroke="#06b6d4" stroke-width="2" class="connecting-line" />

    <circle cx="850" cy="80" r="6" fill="#6366f1" class="particle" />
    <circle cx="980" cy="150" r="10" fill="#a855f7" class="particle" />
    <circle cx="1100" cy="90" r="7" fill="#ec4899" class="particle" />
    <circle cx="1050" cy="240" r="8" fill="#3b82f6" class="particle" />
    <circle cx="850" cy="220" r="6" fill="#06b6d4" class="particle" />
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent1)" />

  <!-- FOREGROUND CONTENT (Guaranteed Clear & Visible) -->
  
  <!-- Category Pill -->
  <g transform="translate(60, 48)">
    <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="18" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" class="badge-text">COMMUNICATION ECOSYSTEM</text>
  </g>

  <!-- Title -->
  <text x="60" y="132" class="title">Awesome Real-Time Communication SDK &amp; CPaaS</text>

  <!-- Subtitle -->
  <text x="60" y="172" class="subtitle">Curated directory of Voice, Video, WebRTC, Telephony &amp; Messaging Platforms</text>

  <!-- Metric Badges Row -->
  <g transform="translate(60, 218)">
    <!-- Pill 1: WebRTC -->
    <g transform="translate(0, 0)">
      <rect width="130" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="23" class="badge-text" fill="#38bdf8">⚡ WebRTC</text>
    </g>

    <!-- Pill 2: CPaaS -->
    <g transform="translate(145, 0)">
      <rect width="130" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="23" class="badge-text" fill="#a78bfa">📞 CPaaS APIs</text>
    </g>

    <!-- Pill 3: Telephony -->
    <g transform="translate(290, 0)">
      <rect width="150" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="23" class="badge-text" fill="#f472b6">📟 SIP &amp; Telephony</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(455, 0)">
      <rect width="155" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="23" class="badge-text" fill="#34d399">🔓 Open Source</text>
    </g>
  </g>
</svg>
